<!DOCTYPE html>
<html>
<head>
  <title>Typing Animation</title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #typed-text {
      color: white;
      font-size: 44px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

<div id="typed-text"></div>

<script>
const text = "If we fail to plan, we plan to fail!";
const target = document.getElementById("typed-text");

let index = 0;
let deleting = false;

function loop() {
  if (!deleting) {
    target.textContent = text.substring(0, index);
    index++;

    if (index > text.length) {
      deleting = true;
      setTimeout(loop, 1500);
      return;
    }
  } else {
    target.textContent = text.substring(0, index);
    index--;

    if (index < 0) {
      deleting = false;
      index = 0;
    }
  }

  setTimeout(loop, deleting ? 40 : 80);
}

loop();
</script>

</body>
</html>
